name: kas_santri
description: "Aplikasi Manajemen Kas Santri - Sistem Uang Saku & Titipan Santri Harian Offline-First"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Offline Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Formatting & Localization
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Hardware & Security
  local_auth: ^2.2.0

  # Sharing, Files & Export
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.5
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
