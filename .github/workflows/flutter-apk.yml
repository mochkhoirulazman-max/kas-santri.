name: Kas Santri CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# ==============================================================================
# Pilar 5: Penanganan Secrets & Lingkungan Aman
# Menggunakan mock, stub, dan variabel dummy aman tanpa ketergantungan API nyata
# ==============================================================================
env:
  CI: 'true'
  APP_ENV: 'ci-testing'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  OFFLINE_MODE: 'true'
  DUMMY_DATABASE_KEY: 'ci-safe-offline-stub'

jobs:
  # ============================================================================
  # Pilar 4 - Job 1: Linting & Formatting
  # ============================================================================
  lint-and-format:
    name: 1. Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      # Pilar 1: Patok versi action (@v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pilar 3: Environment Parity dengan .flutter-version
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Pilar 6: Caching Terukur terikat hashFiles
      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      # Pilar 1: Instalasi bersih / strict
      - name: Install dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "Formatting differences detected. Applying standard format..."
            dart format lib test
          fi

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ============================================================================
  # Pilar 4 - Job 2: Type Checking & Static Contracts
  # ============================================================================
  type-check:
    name: 2. Type Check & Static Contracts
    runs-on: ubuntu-latest
    needs: [lint-and-format]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Type Safety & Analyzer Rules
        run: flutter analyze --no-fatal-infos --fatal-warnings

  # ============================================================================
  # Pilar 4 - Job 3: Unit & Widget Tests
  # ============================================================================
  unit-tests:
    name: 3. Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: [type-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

  # ============================================================================
  # Pilar 4 - Job 4: Build Signed Release APK & Play Store App Bundle (.AAB)
  # ============================================================================
  build-release-apk:
    name: 4. Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pilar 3: Java 21 Temurin (dibutuhkan oleh AGP 9.3.1 / Gradle 9.5)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Pilar 3: Flutter Stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment Parity
        run: |
          java -version
          flutter --version

      # Pilar 6: Caching Terukur untuk Pub & Gradle
      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Cache Gradle wrapper & build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Configure Android Gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating Android Gradle wrapper via Flutter..."
            flutter create --platforms=android .
            rm -f android/*.gradle.kts android/app/*.gradle.kts
            rm -rf android/app/src/main/kotlin/com/pondok/kas_santri
          fi
          chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Release Keystore (Safe Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Configuring release signing keystore for AAB & APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "Keystore secrets not configured yet. Falling back to debug signing config."
          fi

      - name: Build Release APK
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -n "$REVENUECAT_ANDROID_API_KEY" ]; then
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --dart-define=PLAY_STORE_BUILD=false --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"
          else
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --dart-define=PLAY_STORE_BUILD=false
          fi

      - name: Build Signed Release App Bundle (AAB)
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [ -n "$REVENUECAT_ANDROID_API_KEY" ]; then
            flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation --dart-define=PLAY_STORE_BUILD=true --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"
          else
            flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation --dart-define=PLAY_STORE_BUILD=true
          fi

      - name: Clean Signing Secrets
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kas-santri-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB (Google Play) to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kas-santri-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
