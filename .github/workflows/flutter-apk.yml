name: Build Flutter APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Configure Android wrapper
        run: |
          flutter create --platforms=android .
          chmod +x android/gradlew || true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Build APK Release
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build_verbose.log

      - name: Output Build Summary
        if: always()
        run: |
          echo "### Flutter Build Output (Last 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build_verbose.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kas-santri-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
